<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易宿 - 酒店商家管理后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: linear-gradient(90deg, #6a85b6 0%, #bac8e0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        /* 顶部导航 */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 14px;
        }
        .lang-switch {
            cursor: pointer;
        }
        /* 登录容器 */
        .login-container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        /* 左侧表单区 */
        .login-form {
            width: 45%;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
        }
        .logo {
            display: flex;
            align-items: center;
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 40px;
        }
        .logo-icon {
            width: 32px;
            height: 32px;
            background: #409eff;
            border-radius: 4px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #409eff;
        }
        .forgot-pwd {
            text-align: right;
            font-size: 12px;
            color: #409eff;
            cursor: pointer;
            margin-top: -12px;
            margin-bottom: 24px;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #409eff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-btn:hover {
            background: #337ecc;
        }
        .divider {
            text-align: center;
            margin: 24px 0;
            color: #999;
            font-size: 12px;
        }
        .other-login {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .other-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            background: #fff;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .wechat-login {
            text-align: center;
            font-size: 14px;
            color: #409eff;
            cursor: pointer;
            margin-bottom: 24px;
        }
        .privacy {
            text-align: center;
            font-size: 12px;
            color: #999;
        }
        .privacy a {
            color: #409eff;
            text-decoration: none;
        }
        /* 右侧宣传区 */
        .login-banner {
            width: 55%;
            background: linear-gradient(135deg, #6a85b6 0%, #8b9abc 100%);
            color: #fff;
            padding: 80px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .banner-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        .banner-desc {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        .register-btn {
            align-self: flex-start;
            padding: 10px 24px;
            border: 1px solid #fff;
            border-radius: 20px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            transition: background 0.3s;
        }
        .register-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        /* 错误弹窗 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-content {
            background: #fff;
            padding: 30px 40px;
            border-radius: 8px;
            text-align: center;
            width: 100%;
            max-width: 320px;
        }
        .modal-content p {
            margin-bottom: 20px;
            color: #333;
        }
        .modal-btn {
            padding: 8px 24px;
            background: #409eff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="top-bar">
        <div>旅游酒店商家管理后台</div>
        <div class="lang-switch">简体中文</div>
    </div>

    <!-- 登录主体 -->
    <div class="login-container">
        <!-- 左侧登录表单 -->
        <div class="login-form">
            <div class="logo">
                <div class="logo-icon">🏨</div>
                <span>易宿</span>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <input type="text" id="username" placeholder="输入用户名" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="输入密码" required>
                </div>
                <div class="forgot-pwd">忘记密码?</div>
                <button type="submit" class="login-btn">登录</button>
            </form>
            <div class="divider">或通过以下方式</div>
            <div class="other-login">
                <button class="other-btn">📱 短信验证码</button>
                <button class="other-btn">📧 邮箱验证码</button>
            </div>
            <div class="wechat-login">💬 使用微信扫一扫登录</div>
            <div class="privacy">
                登录或注册表示同意我们的 <a href="#">隐私政策</a>
            </div>
        </div>
        <!-- 右侧宣传区 -->
        <div class="login-banner">
            <p>欢迎使用易宿 ebooking</p>
            <h2 class="banner-title">您的酒店管理专家</h2>
            <p class="banner-desc">
                易宿酒店商家管理系统为各类型酒店提供客源拓展、接待经营、口碑维护、数据指导、宣传营销、客户管理等一站式解决方案
            </p>
            <button class="register-btn">立即入驻 ></button>
        </div>
    </div>

    <!-- 错误弹窗 -->
    <div class="modal" id="errorModal">
        <div class="modal-content">
            <p>用户名或密码错误，请重新输入！</p>
            <button class="modal-btn" id="closeModal">确定</button>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorModal = document.getElementById('errorModal');
        const closeModal = document.getElementById('closeModal');

        // 模拟账号密码
        const DEFAULT_USER = 'user';
        const DEFAULT_ADMIN = 'admin';
        const DEFAULT_PWD = '123456';

        // 登录提交
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (username === DEFAULT_USER && password === DEFAULT_PWD) {
                // 每个标签页独立会话，使用 sessionStorage
                sessionStorage.setItem('role', 'user');
                sessionStorage.setItem('username', username);
                window.location.href = 'dashboard.html';
            } else if (username === DEFAULT_ADMIN && password === DEFAULT_PWD) {
                sessionStorage.setItem('role', 'admin');
                sessionStorage.setItem('username', username);
                window.location.href = 'admin.html';
            } else {
                // 登录失败，显示弹窗
                errorModal.style.display = 'flex';
            }
        });

        // 关闭弹窗
        closeModal.addEventListener('click', function() {
            errorModal.style.display = 'none';
        });

        // 点击弹窗外部关闭
        window.addEventListener('click', function(e) {
            if (e.target === errorModal) {
                errorModal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
