<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易宿 - 酒店管理列表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f5f7fa;
            color: #333;
        }
        /* 顶部导航栏 - 统一风格 */
        .top-nav {
            background: linear-gradient(90deg, #6a85b6 0%, #8b9abc 100%);
            color: #fff;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 99;
        }
        .nav-logo {
            display: flex;
            align-items: center;
            font-size: 20px;
            font-weight: 600;
        }
        .nav-logo .logo-icon {
            width: 28px;
            height: 28px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .logout-btn {
            padding: 6px 16px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: background 0.3s;
        }
        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        /* 主容器 */
        .container {
            max-width: 1400px;
            margin: 32px auto;
            padding: 0 32px;
        }
        /* 页面标题 */
        .page-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        /* 新增酒店按钮 */
        .btn-add {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #409eff;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-add:hover {
            background: #337ecc;
        }
        /* 酒店卡片列表 */
        .hotel-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 24px;
        }
        /* 酒店卡片样式 */
        .hotel-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 24px;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative; /* 允许在卡片上放置角标 */
        }
        .card-thumb {
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            background: #f8f9fa;
            margin-bottom: 12px;
            aspect-ratio: 16 / 9; /* 统一16:9缩略图比例 */
            max-height: 150px; /* 示例尺寸：约 150px */
            width: 100%;
        }
        /* 未审核卡片使用更紧凑的缩略图 */
        .card-thumb.small {
            max-height: 120px;
            aspect-ratio: 16 / 9;
        }
        .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .hotel-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        .hotel-card .hotel-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        /* 商家未审核角标 */
        .merchant-badge {
            position: absolute;
            left: 14px;
            top: 12px;
            background: #f5a623;
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            z-index: 5;
        }
        .hotel-card .hotel-attr {
            font-size: 14px;
            color: #666;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hotel-card .hotel-attr span {
            display: inline-block;
            padding: 2px 8px;
            background: #f5f7fa;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 8px;
        }
        .hotel-card .hotel-desc {
            font-size: 13px;
            color: #999;
            margin-top: 16px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* 卡片按钮组 */
        .card-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .action-btn.detail {
            background: #409eff;
            color: #fff;
        }
        .action-btn.detail:hover {
            background: #337ecc;
        }
        .action-btn.edit {
            background: #67c23a;
            color: #fff;
        }
        .action-btn.edit:hover {
            background: #529b2e;
        }
        /* 空状态 */
        .empty-tip {
            text-align: center;
            padding: 80px 0;
            color: #999;
            font-size: 16px;
        }
        /* 响应式适配 */
        @media (max-width: 768px) {
            .container {
                padding: 0 16px;
            }
            .hotel-list {
                grid-template-columns: 1fr;
            }
            .page-title {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="top-nav">
        <div class="nav-logo">
            <div class="logo-icon">🏨</div>
            <span>易宿酒店商家管理后台</span>
        </div>
        <!-- 顶部保留用户信息，筛选按钮已下移到页面内容区 -->
        <div class="user-info">
            <span id="userWelcome">欢迎</span>
            <button class="logout-btn" id="logoutBtn">退出登录</button>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="container">
        <!-- 页面标题 + 新增酒店按钮 -->
        <div class="page-title">
            <span>我的酒店</span>
            <button class="btn-add" onclick="window.location.href='hotel-edit.html'">
                ➕ 新增酒店
            </button>
        </div>
        <div id="filterRow" style="display:flex;gap:8px;align-items:center;margin-top:8px;">
            <button id="tabAll" type="button" class="btn-add" style="background:#fff;color:#333;border:1px solid #e6e6e6;cursor:pointer">全部</button>
            <button id="tabApproved" type="button" class="btn-add" style="background:#f5f7fa;color:#333;border:1px solid #e6e6e6;cursor:pointer">已审核</button>
            <button id="tabPending" type="button" class="btn-add" style="background:#fff8ea;color:#333;border:1px solid #f5a623;cursor:pointer">未审核</button>
        </div>

        <!-- 酒店卡片列表（由后端数据渲染） -->
        <div class="hotel-list"></div>
    </div>
    <script>
        // 渲染逻辑：从后端拉取已审核酒店与商家提交（submissions）并渲染
        (function(){
            const listContainer = document.querySelector('.hotel-list');
            if (!listContainer) return;

            function imgFor(h) {
                try { if (h.image) return h.image; } catch(e){}
                return 'pic/hotel_' + (h.id||0) + '.png';
            }

            function makeHotelCard(h, opts={approved:true}){
                const div = document.createElement('div');
                div.className = 'hotel-card';
                if (opts.approved) div.setAttribute('data-approved','true');
                if (!opts.approved) div.setAttribute('data-merchant-id', h.id||'');
                const roomTypes = (h.roomTypes && Array.isArray(h.roomTypes)) ? h.roomTypes.join('、') : (h.roomTypes||'');
                const discounts = (h.discounts && Array.isArray(h.discounts)) ? h.discounts.join('，') : (h.discounts||'');
                div.innerHTML = `
                    <div class="card-thumb"><img src="${imgFor(h)}" alt="${h.name||''}"></div>
                    <div class="hotel-name">${h.name||''}</div>
                    <div class="hotel-attr"><span>${h.star||''}</span> ${h.address||''}</div>
                    <div class="hotel-attr">价格区间：${h.priceRange||''}</div>
                    <div class="hotel-attr">总客房数：${h.totalRooms||''}</div>
                    <div class="hotel-attr">热门房型：${roomTypes}</div>
                    <div class="hotel-desc">${discounts}</div>
                    <div class="card-btn-group">
                        <button class="action-btn detail" data-id="${h.id}">酒店详情</button>
                        <button class="action-btn edit" data-id="${h.id}">修改</button>
                        <button class="action-btn delete" data-id="${h.id}">删除</button>
                    </div>
                `;
                return div;
            }

            async function loadAndRender(){
                listContainer.innerHTML = '';
                // first render submissions (merchant drafts)
                try {
                    const sres = await fetch('/api/submissions');
                    const sjson = await sres.json();
                    if (sjson && Array.isArray(sjson.data) && sjson.data.length) {
                        sjson.data.forEach(it => {
                            const card = makeHotelCard(it, {approved:false});
                            // admin actions for pending
                            const role = sessionStorage.getItem('role') || '';
                            if (role === 'admin' && (it.status === 'pending' || !it.status)) {
                                const adminBox = document.createElement('div');
                                adminBox.style.marginTop = '8px';
                                adminBox.style.display = 'flex';
                                adminBox.style.gap = '8px';
                                adminBox.innerHTML = `<button class="action-btn approve" data-id="${it.id}">通过</button><button class="action-btn reject" data-id="${it.id}">驳回</button>`;
                                card.appendChild(adminBox);
                            }
                            listContainer.appendChild(card);
                        });
                    }
                } catch (e) { console.warn('load submissions failed', e); }

                // next render approved hotels
                try {
                    const hres = await fetch('/api/hotels');
                    const hjson = await hres.json();
                    if (hjson && Array.isArray(hjson.data) && hjson.data.length) {
                        hjson.data.forEach(h => listContainer.appendChild(makeHotelCard(h, {approved:true})));
                    }
                } catch (e) { console.warn('load hotels failed', e); }
            }

            // delegate clicks for card buttons
            document.body.addEventListener('click', async (ev) => {
                const t = ev.target;
                if (!t) return;
                const id = t.dataset && t.dataset.id ? parseInt(t.dataset.id) : null;
                if (t.classList.contains('detail') && id) return window.location.href = `hotel-detail.html?id=${id}`;
                if (t.classList.contains('edit') && id) return window.location.href = `hotel-edit.html?id=${id}`;
                if (t.classList.contains('delete') && id) {
                    if (!confirm('确认删除该酒店？')) return;
                    try {
                        // try delete hotel first (approved)
                        const res = await fetch(`/api/hotels/${id}`, { method: 'DELETE' });
                        if (res.ok) { loadAndRender(); return; }
                    } catch(e){}
                    // else try reject submission
                    try {
                        await fetch(`/api/submissions/${id}/reject`, { method: 'POST' });
                        loadAndRender();
                    } catch (e) { console.error(e); alert('删除失败'); }
                }
                if (t.classList.contains('approve') && id) {
                    try {
                        const res = await fetch(`/api/submissions/${id}/approve`, { method: 'POST' });
                        if (res.ok) { loadAndRender(); }
                    } catch(e){ console.error(e); alert('通过失败'); }
                }
                if (t.classList.contains('reject') && id) {
                    try { await fetch(`/api/submissions/${id}/reject`, { method: 'POST' }); loadAndRender(); } catch(e){ console.error(e); alert('驳回失败'); }
                }
            });

            // initial load
            loadAndRender();
        })();
            // 全局删除函数：优先调用后端删除接口，失败时回退到本地清理
            async function handleDeleteHotel(id) {
                if (!id) return;
                if (!confirm('确认删除该酒店？该操作会移除酒店及其关联数据。')) return;
                try {
                    const resp = await fetch(`/api/hotels/${id}`, { method: 'DELETE' });
                    if (resp.ok) { window.location.href = 'dashboard.html'; return; }
                } catch(e) { console.warn('delete api failed', e); }
                try {
                    let merchants = JSON.parse(localStorage.getItem('merchantHotels') || '[]');
                    merchants = merchants.filter(h => h.id !== id);
                    localStorage.setItem('merchantHotels', JSON.stringify(merchants));
                } catch (e) {}
                try {
                    let approved = JSON.parse(localStorage.getItem('hotels') || '[]');
                    approved = approved.filter(h => h.id !== id);
                    localStorage.setItem('hotels', JSON.stringify(approved));
                } catch (e) {}
                try { localStorage.removeItem('hotelImage:' + id); } catch (e) {}
                try { localStorage.removeItem('hotelRooms:' + id); } catch (e) {}
                try { localStorage.removeItem('hotelOrders:' + id); } catch (e) {}
                try { localStorage.removeItem('priceListDraft:' + id); } catch (e) {}
                window.location.href = 'dashboard.html';
            }
        // 顶部用户信息显示与退出（使用 sessionStorage，实现标签页独立会话）
        (function() {
            const welcome = document.getElementById('userWelcome');
            const logoutBtn = document.getElementById('logoutBtn');
            const name = sessionStorage.getItem('username') || '';
            const role = sessionStorage.getItem('role') || 'user';
            if (welcome) welcome.textContent = name ? `欢迎，${name}（${role}）` : '欢迎，商户';
            if (logoutBtn) logoutBtn.addEventListener('click', () => {
                try { sessionStorage.removeItem('username'); sessionStorage.removeItem('role'); } catch(e){}
                window.location.href = 'loginPage.html';
            });
        })();

        // 选项卡过滤逻辑：全部 / 已审核 / 未审核（基于 card 的 data-* 标记）
        (function setupFilterTabs(){
            const tabAll = document.getElementById('tabAll');
            const tabApproved = document.getElementById('tabApproved');
            const tabPending = document.getElementById('tabPending');
            const listContainer = document.querySelector('.hotel-list');
            if (!listContainer) return;
            function setActive(button){
                [tabAll,tabApproved,tabPending].forEach(b=>{
                    if(!b) return;
                    b.style.opacity = (b===button? '1':'0.7');
                    b.style.boxShadow = (b===button? '0 2px 8px rgba(0,0,0,0.08)':'none');
                });
            }
            function applyFilter(filter){
                console.log('applyFilter', filter);
                const cards = listContainer.querySelectorAll('.hotel-card');
                cards.forEach(card => {
                    const isMerchant = card.hasAttribute('data-merchant-id');
                    const isApproved = card.getAttribute('data-approved') === 'true' || (!isMerchant && !card.hasAttribute('data-merchant-id'));
                    let show = true;
                    if (filter === 'approved') show = !!isApproved;
                    if (filter === 'pending') show = !!isMerchant;
                    card.style.display = show ? '' : 'none';
                });
            }
            if (tabAll) tabAll.addEventListener('click', ()=>{ setActive(tabAll); applyFilter('all'); });
            if (tabApproved) tabApproved.addEventListener('click', ()=>{ setActive(tabApproved); applyFilter('approved'); });
            if (tabPending) tabPending.addEventListener('click', ()=>{ setActive(tabPending); applyFilter('pending'); });
            // 初始化为全部
            setActive(tabAll); applyFilter('all');
        })();
    </script>
</body>
</html>
