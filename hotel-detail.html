<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易宿 - 酒店详情管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f5f7fa;
            color: #333;
        }
        /* 顶部导航栏 - 复用统一风格 */
        .top-nav {
            background: linear-gradient(90deg, #6a85b6 0%, #8b9abc 100%);
            color: #fff;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 99;
        }
        .nav-logo {
            display: flex;
            align-items: center;
            font-size: 20px;
            font-weight: 600;
        }
        .nav-logo .logo-icon {
            width: 28px;
            height: 28px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .logout-btn {
            padding: 6px 16px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: background 0.3s;
        }
        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        /* 主容器 - 左右布局，左侧导航固定 */
        .container {
            max-width: 1400px;
            margin: 32px auto;
            padding: 0 32px;
            display: flex;
            gap: 24px;
        }
        /* 左侧导航栏 - 改为3个选项，样式强化 */
        .tab-nav {
            width: 240px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow: hidden;
            position: sticky;
            top: 100px;
            align-self: flex-start;
            height: fit-content;
        }
        .tab-item {
            padding: 18px 24px;
            font-size: 16px;
            cursor: pointer;
            border-left: 4px solid transparent;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .tab-item.active {
            background: rgba(64, 158, 255, 0.1);
            color: #409eff;
            border-left-color: #409eff;
            font-weight: 600;
        }
        .tab-item:hover {
            background: #f8f9fa;
        }
        /* 右侧内容区 - 样式不变，适配多板块 */
        .tab-content {
            flex: 1;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 28px;
            min-height: 600px;
        }
        .content-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .content-title .hotel-name {
            font-size: 20px;
            font-weight: 600;
        }
        /* 1. 酒店基本情况样式 - 完全保留原有设计 */
        .base-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .info-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .info-label {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }
        .info-value {
            font-size: 16px;
            color: #333;
            line-height: 1.5;
        }
        .info-value.en {
            color: #999;
            font-size: 14px;
            margin-top: 4px;
        }
        .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .tag {
            padding: 4px 12px;
            background: #f5f7fa;
            border-radius: 20px;
            font-size: 12px;
            color: #666;
        }
        .tag.hot {
            background: rgba(250, 128, 114, 0.1);
            color: #fa8072;
        }
        .discount-tag {
            background: rgba(245, 108, 108, 0.1);
            color: #f56c6c;
            border: 1px solid #f56c6c;
        }
        /* 顶部主图 + 标题行 */
        .hero-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        /* 酒店主图（单张，按比例缩放） */
        .image-hero {
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            background: #f8f9fa;
            flex: 0 0 48%;
            aspect-ratio: 16 / 9; /* 1280×720 推荐比例，等比例缩放 */
        }
        .image-hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* 酒店标题块（右侧） */
        .hotel-title-block {
            flex: 1;
            padding: 8px 12px;
        }
        .hotel-title-cn {
            font-size: 22px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }
        .hotel-title-en {
            font-size: 14px;
            color: #999;
        }
        .hotel-subline {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
            line-height: 1.6;
        }
        .meta-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .meta-chip {
            padding: 4px 10px;
            background: #f5f7fa;
            border-radius: 16px;
            font-size: 12px;
            color: #666;
        }
        /* 图片下方：热门景点 + 交通两行 */
        .below-tags-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 10px 0 16px;
        }
        .below-line {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .below-label {
            font-size: 14px;
            color: #666;
            font-weight: 700; /* 非标签文本加粗 */
        }
        /* 2. 房价概览样式 - 参考图片设计，分概览卡片+房价表格 */
        .price-overview {
            width: 100%;
        }
        /* 房价概览统计卡片 - 与原有统计风格统一 */
        .price-stats {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .price-stat-card {
            flex: 1;
            min-width: 180px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
        }
        .price-stat-num {
            font-size: 24px;
            font-weight: 700;
            color: #f56c6c;
            margin: 8px 0;
        }
        .price-stat-label {
            font-size: 14px;
            color: #666;
        }
        .price-stat-num.avg {
            color: #409eff;
        }
        .price-stat-num.rate {
            color: #67c23a;
        }
        /* 房型图片缩略图 */
        .room-thumb {
            width: 100px;
            aspect-ratio: 16 / 9;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            background: #f8fafc;
            overflow: hidden;
            display: grid;
            place-items: center;
        }
        .room-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .thumb-empty { font-size: 12px; color: #999; }
        /* 弹窗图片预览与选择 */
        .image-preview-box {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .image-preview {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            background: #f8fafc;
            overflow: hidden;
            display: grid;
            place-items: center;
        }
        .image-preview img { width: 100%; height: 100%; object-fit: cover; }
        .file-tip { font-size: 12px; color: #999; }
        /* 房型操作按钮与弹窗 */
        .title-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-mini {
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
            border: none;
            cursor: pointer;
        }
        .btn-primary-mini { background: #409eff; color: #fff; }
        .btn-default-mini { background: #f5f7fa; color: #666; border: 1px solid #dcdcdc; }
        .btn-primary-mini:hover { background: #337ecc; }
        .btn-default-mini:hover { background: #eef2f7; }
        .action-mini { padding: 4px 8px; border-radius: 4px; font-size: 12px; border: none; cursor: pointer; }
        .action-mini.edit { background: #67c23a; color: #fff; }
        .action-mini.edit:hover { background: #529b2e; }
        .action-mini.delete { background: #f56c6c; color: #fff; }
        .action-mini.delete:hover { background: #dd4f4f; }
        .room-ops { display: flex; gap: 8px; }
        /* 弹窗 */
        .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: none; align-items: center; justify-content: center; z-index: 999; }
        .modal-card { width: 520px; max-width: 92%; max-height: 70vh; background: #fff; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
        .modal-header { padding: 10px 14px; font-weight: 600; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; overflow-y: auto; }
        .modal-footer { padding: 10px 14px; border-top: 1px solid #f0f0f0; display: flex; justify-content: flex-end; gap: 10px; }
        .modal-item { display: flex; flex-direction: column; gap: 6px; }
        .modal-label { font-size: 13px; color: #666; }
        .modal-input, .modal-select { padding: 8px 10px; border: 1px solid #dcdcdc; border-radius: 4px; font-size: 14px; }
        /* 当日房价表格 - 适配价格展示，增加原价/折后价/房态列 */
        .price-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        .price-table th,
        .price-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        .price-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #666;
        }
        .price-table tr:hover {
            background: #fafafa;
        }
        .price-original {
            color: #999;
            text-decoration: line-through;
            font-size: 12px;
            margin-right: 8px;
        }
        .price-current {
            color: #f56c6c;
            font-weight: 600;
        }
        .room-status {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .room-status.available {
            background: rgba(103, 194, 58, 0.1);
            color: #67c23a;
        }
        .room-status.low {
            background: rgba(250, 173, 20, 0.1);
            color: #fad529;
        }
        .room-status.soldout {
            background: rgba(245, 108, 108, 0.1);
            color: #f56c6c;
        }
        /* 3. 当日订单情况样式 - 复用原有订单表格，优化列名和展示 */
        .order-list {
            width: 100%;
        }
        /* 概览统计条 */
        .order-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }
        .overview-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px 16px;
        }
        .overview-label {
            font-size: 13px;
            color: #666;
        }
        .overview-num {
            font-size: 24px;
            font-weight: 700;
            color: #409eff;
            margin-top: 6px;
        }
        .order-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        .order-table th,
        .order-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        .order-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #666;
        }
        .order-table tr:hover {
            background: #fafafa;
        }
        .order-status {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .order-status.checked {
            background: rgba(103, 194, 58, 0.1);
            color: #67c23a;
        }
        .order-status.pending {
            background: rgba(250, 173, 20, 0.1);
            color: #fad529;
        }
        .order-status.unchecked {
            background: rgba(245, 108, 108, 0.1);
            color: #f56c6c;
        }
        .order-amount {
            color: #f56c6c;
            font-weight: 600;
        }
        /* 订单状态下拉框样式 */
        .order-status-select {
            padding: 4px 6px;
            border: 1px solid #dcdcdc;
            border-radius: 3px;
            font-size: 13px;
            color: #333;
            background: #fff;
        }
        .order-status-select.unchecked {
            background: rgba(64, 158, 255, 0.1);
            color: #409eff;
            border-color: rgba(64, 158, 255, 0.25);
        }
        .order-status-select.pending {
            background: rgba(250, 173, 20, 0.1);
            color: #fad529;
            border-color: rgba(250, 173, 20, 0.25);
        }
        .order-status-select.checked {
            background: rgba(103, 194, 58, 0.1);
            color: #67c23a;
            border-color: rgba(103, 194, 58, 0.25);
        }
        .order-status-select.canceled {
            background: rgba(245, 108, 108, 0.1);
            color: #f56c6c;
            border-color: rgba(245, 108, 108, 0.25);
        }
        /* 返回按钮 */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #409eff;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 16px;
            background: transparent;
            border: none;
        }
        /* 空状态提示 - 统一样式 */
        .empty-tip {
            text-align: center;
            padding: 80px 0;
            color: #999;
            font-size: 16px;
        }
        .empty-tip i {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }
        /* 响应式适配 - 小屏幕下左右布局变上下 */
        @media (max-width: 992px) {
            .container {
                flex-direction: column;
            }
            .tab-nav {
                width: 100%;
                position: static;
            }
            .hero-row { flex-direction: column; }
            .image-hero { flex: 0 0 auto; width: 100%; }
            .base-info {
                grid-template-columns: 1fr;
            }
            .price-stats, .stats-overview {
                flex-direction: column;
            }
            .price-stat-card, .overview-card {
                min-width: 100%;
            }
            /* 表格横向滚动 */
            .price-table, .order-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 - 完全复用，风格统一 -->
    <div class="top-nav">
        <div class="nav-logo">
            <div class="logo-icon">🏨</div>
            <span>易宿酒店商家管理后台</span>
        </div>
        <div class="user-info">
            <span id="userWelcome">欢迎</span>
            <button class="logout-btn" id="logoutBtn">退出登录</button>
        </div>
    </div>

    <!-- 主内容容器 - 左右布局 -->
    <div class="container">
        <!-- 左侧导航栏 - 改为3个选项：基本情况、房价概览、当日订单 -->
        <div class="tab-nav">
            <div class="tab-item active" data-tab="baseInfo">🏨 酒店基本情况</div>
            <div class="tab-item" data-tab="priceOverview">🛏️ 房型概览</div>
            <div class="tab-item" data-tab="orderStatus">📋 当日订单情况</div>
        </div>

        <!-- 右侧内容区 - 包含3个板块，默认显示基本情况 -->
        <div class="tab-content">
            <!-- 返回按钮 -->
            <button class="back-btn" onclick="window.location.href='dashboard.html'">← 返回酒店列表</button>
            
            <!-- 1. 酒店基本情况（主图+标题在上，详情信息在下） -->
            <div id="baseInfo" class="tab-panel active">
                <h2 class="content-title">酒店基本情况</h2>
                <!-- 顶部：主图 + 酒店标题块 -->
                <div class="hero-row">
                    <div class="image-hero" id="detailImageHero"></div>
                    <div class="hotel-title-block" id="hotelTitleBlock"></div>
                </div>
                <!-- 图片下方一行：热门景点 + 交通及商场 -->
                <div class="below-tags-row" id="belowTagsRow"></div>
                <div class="base-info" id="baseInfoContainer">
                    <!-- JS动态渲染，初始为空 -->
                </div>
            </div>

            <!-- 2. 房价概览（参考图片设计，分概览统计+当日房价表格） -->
            <div id="priceOverview" class="tab-panel" style="display: none;">
                <h2 class="content-title">房型概览
                    <span class="title-actions">
                        <button class="btn-mini btn-primary-mini" id="btnAddRoom">新增房型</button>
                    </span>
                </h2>
                <div class="price-overview" id="priceOverviewContainer">
                    <!-- 房价概览统计卡片 -->
                    <div class="price-stats" id="priceStatsContainer">
                        <!-- JS动态渲染 -->
                    </div>
                    <!-- 当日房价表格 -->
                    <table class="price-table">
                        <thead>
                            <tr>
                                <th>房型图片</th>
                                <th>房型名称</th>
                                <th>剩余房量</th>
                                <th>房态</th>
                                <th>当日价格</th>
                                <th>折扣</th>
                                <th>备注</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="priceTableBody">
                            <!-- JS动态渲染 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 3. 当日订单情况（复用原有订单数据，优化表格列名和展示） -->
            <div id="orderStatus" class="tab-panel" style="display: none;">
                <h2 class="content-title">当日订单情况（<span id="orderDate"></span>）</h2>
                <div class="order-list" id="orderListContainer">
                    <!-- 概览统计 -->
                    <div class="order-overview" id="orderOverviewContainer"></div>
                    <table class="order-table">
                        <thead>
                            <tr>
                                <th>订单编号</th>
                                <th>房间号</th>
                                <th>房型</th>
                                <th>入住客人</th>
                                <th>预订电话</th>
                                <th>订单金额</th>
                                <th>订单状态</th>
                                <th>预计离店</th>
                                <th>支付方式</th>
                            </tr>
                        </thead>
                        <tbody id="orderTableBody">
                            <!-- JS动态渲染 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 使用后端数据驱动：通过 /api 接口获取酒店、房型与订单数据并渲染
        function getUrlParam(key) {
            const params = new URLSearchParams(window.location.search);
            return parseInt(params.get(key)) || 0;
        }
        let currentHotelId = getUrlParam('id');

        async function fetchFirstHotelId() {
            try {
                const res = await fetch('/api/hotels');
                const j = await res.json();
                if (j && Array.isArray(j.data) && j.data.length) return j.data[0].id;
            } catch (e) { console.warn('fetch hotels failed', e); }
            return 0;
        }

        async function initPage() {
            if (!currentHotelId) {
                const first = await fetchFirstHotelId();
                if (first) currentHotelId = first; else return document.getElementById('baseInfoContainer').innerHTML = '<div class="empty-tip">未找到酒店数据</div>';
            }
            await loadAndRenderHotel(currentHotelId);
        }

        async function loadAndRenderHotel(id) {
            try {
                const res = await fetch(`/api/hotels/${id}`);
                if (!res.ok) throw new Error('hotel not found');
                const j = await res.json();
                const h = j.data;
                renderHero(h);
                renderBaseInfo(h);
                renderPriceOverview(h);
                await renderRooms(id);
                await renderOrders(id);
            } catch (e) {
                console.error(e);
                document.getElementById('baseInfoContainer').innerHTML = '<div class="empty-tip">加载酒店失败</div>';
            }
        }

        // 归一化酒店对象，确保页面渲染时字段存在且类型正确
        function normalizeHotel(raw) {
            if (!raw) return null;
            const h = JSON.parse(JSON.stringify(raw)); // shallow clone
            // roomTypes: 支持数组或逗号分隔字符串
            if (!h.roomTypes) h.roomTypes = [];
            else if (typeof h.roomTypes === 'string') {
                h.roomTypes = h.roomTypes.split(',').map(s => s.trim()).filter(Boolean);
            }
            // scenicSpots / trafficMall / discounts: 支持数组或逗号分隔字符串
            ['scenicSpots','trafficMall','discounts'].forEach(key => {
                if (!h[key]) h[key] = [];
                else if (typeof h[key] === 'string') {
                    h[key] = h[key].split(',').map(s => s.trim()).filter(Boolean);
                }
            });
            // priceData.roomPriceList
            if (!h.priceData) h.priceData = { roomPriceList: [] };

        async function handleDeleteHotel(id) {
            if (!id) return;
            if (!confirm('确认删除该酒店？该操作会移除该酒店及其关联数据。')) return;
            try {
                const resp = await fetch(`/api/hotels/${id}`, { method: 'DELETE' });

                    try { localStorage.removeItem('priceListDraft:' + id); } catch(e){}

                    return;
                }

                console.error('delete hotel api failed', e);
            }
            // 后端删除失败或不可用时，退回到旧的本地删除（尽量保留兼容性）
            try {
                let merchants = JSON.parse(localStorage.getItem('merchantHotels') || '[]');
                merchants = merchants.filter(h => h.id !== id);
                localStorage.setItem('merchantHotels', JSON.stringify(merchants));
            } catch (e) {}
            try {
                let approved = JSON.parse(localStorage.getItem('hotels') || '[]');
                approved = approved.filter(h => h.id !== id);
                localStorage.setItem('hotels', JSON.stringify(approved));
            } catch (e) {}
            try { localStorage.removeItem('hotelImage:' + id); } catch (e) {}
            try { localStorage.removeItem('hotelRooms:' + id); } catch (e) {}
            try { localStorage.removeItem('hotelOrders:' + id); } catch (e) {}
            try { localStorage.removeItem('priceListDraft:' + id); } catch (e) {}
            window.location.href = 'dashboard.html';
        }

        // 16:9 居中裁剪并缩放到指定尺寸
        function resizeImgTo16x9(img, targetW=1280, targetH=720) {
            const canvas = document.createElement('canvas');
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext('2d');
            const srcW = img.naturalWidth || img.width;
            const srcH = img.naturalHeight || img.height;
            const targetRatio = targetW / targetH;
            const srcRatio = srcW / srcH;
            let drawW, drawH, sx, sy, sW, sH;
            if (srcRatio > targetRatio) {
                // 源图偏宽，按高度裁剪
                sH = srcH;
                sW = Math.floor(srcH * targetRatio);
                sx = Math.floor((srcW - sW) / 2);
                sy = 0;
            } else {
                // 源图偏高，按宽度裁剪
                sW = srcW;
                sH = Math.floor(srcW / targetRatio);
                sx = 0;
                sy = Math.floor((srcH - sH) / 2);
            }
            ctx.drawImage(img, sx, sy, sW, sH, 0, 0, targetW, targetH);
            return canvas.toDataURL('image/jpeg', 0.9);
        }

        // 3. 渲染当日订单情况（复用原有数据，优化表格列名和展示）
        async function renderOrderStatus(hotel) {
            const tableBody = document.getElementById('orderTableBody');

            // 格式化当日日期
            const today = new Date().toLocaleDateString('zh-CN', {year: 'numeric', month: '2-digit', day: '2-digit'}).replace(/\//g, '-');
            orderDate.innerText = today;

            // 订单状态文本映射

                unchecked: "未入住",

            };
            // 从后端获取订单列表
            let mergedOrderList = [];
            try {
                const res = await fetch(`/api/orders/${currentHotelId}`);
                const j = await res.json();
                mergedOrderList = Array.isArray(j.data) ? j.data.map(o => ({ orderNo: o.orderNo || '', room: o.room || '', type: o.type || '', guest: o.guest || '', phone: o.phone || '', amount: o.amount || '', status: o.status || '', leave: o.leaveDate || '', payType: o.payType || '' })) : [];

            // 概览统计数据
            const checkedCount = mergedOrderList.filter(o => o.status === 'checked').length;
            const leaveTodayCount = mergedOrderList.filter(o => o.leave === today).length;
            const availableRooms = (hotel.priceData?.roomPriceList || []).reduce((sum, r) => sum + (parseInt(r.remain) || 0), 0);
            const totalRooms = hotel.totalRooms || 0;
            const occupiedRooms = Math.max(0, totalRooms - availableRooms);
            overview.innerHTML = `
                <div class="overview-item">
                    <div class="overview-label">今日入住</div>
                    <div class="overview-num">${checkedCount}</div>
                </div>

                    <div class="overview-num">${leaveTodayCount}</div>
                </div>
                <div class="overview-item">

                </div>
                <div class="overview-item">
                    <div class="overview-label">全部已占用</div>
                    <div class="overview-num">${occupiedRooms}</div>
                </div>
            `;
            // 渲染订单表格
            const tableRows = mergedOrderList.map(item => `
                <tr>
                    <td>${item.orderNo}</td>
                    <td>${item.room}</td>
                    <td>${item.type}</td>
                    <td>${item.guest}</td>

                            <option value="unchecked" ${item.status === 'unchecked' ? 'selected' : ''}>未入住</option>
                            <option value="pending" ${item.status === 'pending' ? 'selected' : ''}>待入住</option>
                            <option value="checked" ${item.status === 'checked' ? 'selected' : ''}>已入住</option>
                            <option value="canceled" ${item.status === 'canceled' ? 'selected' : ''}>已取消</option>
                        </select>
                    </td>
                    <td>${item.leave}</td>
                    <td>${item.payType}</td>
                </tr>
            `).join('');
            tableBody.innerHTML = tableRows;

            // 变更事件：更新状态并提交后端（替换整表）
            const listContainer = document.getElementById('orderListContainer');
            listContainer.addEventListener('change', async function(ev) {
                const target = ev.target;
                if (target && target.classList.contains('order-status-select')) {
                    const orderNo = target.getAttribute('data-order-no');
                    const newStatus = target.value;
                    mergedOrderList = mergedOrderList.map(o => o.orderNo === orderNo ? { ...o, status: newStatus } : o);
                    // 提交到后端，PUT覆盖该酒店的订单
                    try {

                    const firstNum = overview.querySelector('.overview-item .overview-num');
                    if (firstNum) firstNum.textContent = String(newChecked);
                }

        async function renderOrders(hotelId) {
            try {
                const res = await fetch(`/api/orders/${hotelId}`);
                const j = await res.json();
                const orders = Array.isArray(j.data) ? j.data.map(o => ({ orderNo: o.orderNo||'', room: o.room||'', type: o.type||'', guest: o.guest||'', phone: o.phone||'', amount: o.amount||'', status: o.status||'', leave: o.leaveDate||'', payType: o.payType||'' })) : [];
                // reuse renderOrderStatus by passing hotel-like object
                renderOrderStatus({ orderList: orders, priceData: {} , totalRooms:0 });
            } catch (e) { console.warn('renderOrders failed', e); renderOrderStatus({ orderList: [], priceData: {}, totalRooms:0 }); }
        }
    </script>
</body>
